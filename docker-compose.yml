services:
  app:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-genrpg}:${POSTGRES_PASSWORD:-genrpg}@postgres:5432/${POSTGRES_DB:-genrpg}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-genrpg}
      POSTGRES_USER: ${POSTGRES_USER:-genrpg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-genrpg}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-genrpg} -d ${POSTGRES_DB:-genrpg}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
