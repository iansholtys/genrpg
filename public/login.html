<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GenRPG Login</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="login-screen">
  <main class="login-panel">
    <p class="eyebrow">GenRPG</p>
    <h1>Sign in to continue</h1>
    <p class="login-copy">Access to GenRPG is protected by your organization account.</p>
    <a id="loginButton" class="login-button" href="/auth/login">Login via OIDC</a>
  </main>
  <script>
    const returnTo = new URLSearchParams(window.location.search).get("returnTo");
    if (returnTo && returnTo.startsWith("/") && !returnTo.startsWith("//")) {
      document.querySelector("#loginButton").href =
        `/auth/login?returnTo=${encodeURIComponent(returnTo)}`;
    }
  </script>
</body>
</html>
