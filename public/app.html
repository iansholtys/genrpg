<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GenRPG</title>
  <link rel="stylesheet" href="/static/css/table-vars.css">
  <link rel="stylesheet" href="/static/components/reusable/table/styles/table.css">
  <link rel="stylesheet" href="/static/components/reusable/modal/styles/modal.css">
  <link rel="stylesheet" href="/static/css/styles.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous" defer></script>
  <script src="/static/components/reusable/table/table.js" defer></script>
  <script src="/static/components/reusable/modal/modal.js" defer></script>
  <script type="module" src="/static/js/app.js" defer></script>
</head>

<body class="app-shell">
  <header class="topbar">
    <div>
      <p class="eyebrow">GenRPG</p>
      <h1>Instances</h1>
    </div>
    <div class="user-panel">
      <button type="button" id="exitInstanceButton" class="exit-instance-button" hidden aria-label="Exit instance"
        title="Exit instance">&times;</button>
      <span id="userLabel">Signed in</span>
      <form action="/logout" method="post">
        <button type="submit" class="secondary-button">Log out</button>
      </form>
    </div>
  </header>

  <section id="instanceLoading" class="instance-loading" hidden aria-live="polite" aria-busy="true"
    aria-label="Loading instance">
    <p class="eyebrow">GenRPG</p>
    <h2>Loading instance</h2>
    <p id="instanceLoadingName" class="instance-loading__name"></p>
    <progress id="instanceLoadingProgress" class="instance-loading__progress" value="0" max="1"></progress>
    <p id="instanceLoadingStatus" class="instance-loading__status"></p>
  </section>

  <main class="workspace">
    <section class="package-tools" aria-label="Packages">
      <div class="section-heading">
        <h2>Packages</h2>
        <button type="button" id="managePackagesButton" hidden>Manage Packages</button>
        <button type="button" id="manageRolesButton" hidden>Manage Roles</button>
        <button type="button" id="manageGlobalUsersButton" hidden>Manage Users</button>
      </div>
      <div id="packageList" class="package-list" role="group" aria-label="Enabled packages"></div>
    </section>

    <section class="instance-tools" aria-label="Create instance">
      <form id="instanceForm" class="instance-form">
        <label>
          <span>Name</span>
          <input name="name" required maxlength="120" autocomplete="off">
        </label>
        <label>
          <span>Description</span>
          <textarea name="description" rows="3" maxlength="600"></textarea>
        </label>
        <button type="submit">Create Instance</button>
      </form>
    </section>

    <section>
      <div class="section-heading">
        <h2>Your instances</h2>
      </div>
      <div id="message" class="message" role="status"></div>
      <div id="instances"></div>
    </section>
  </main>

  <aside id="updateBanner" class="update-banner" hidden>
    <p>Database package updates are available.</p>
    <button type="button" id="applyUpdatesButton">Update</button>
  </aside>
</body>

</html>
