<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GenRPG</title>
  <link rel="stylesheet" href="/static/css/table-vars.css">
  <link rel="stylesheet" href="/static/components/reusable/table/styles/table.css">
  <link rel="stylesheet" href="/static/css/styles.css">
  <script
    src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
    crossorigin="anonymous"
    defer
  ></script>
  <script src="/static/components/reusable/table/table.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body class="app-shell">
  <header class="topbar">
    <div>
      <p class="eyebrow">GenRPG</p>
      <h1>Instances</h1>
    </div>
    <div class="user-panel">
      <span id="userLabel">Signed in</span>
      <form action="/logout" method="post">
        <button type="submit" class="secondary-button">Log out</button>
      </form>
    </div>
  </header>

  <main class="workspace">
    <section class="package-tools" aria-label="Packages">
      <div class="section-heading">
        <h2>Packages</h2>
        <button type="button" id="managePackagesButton" hidden>Manage Packages</button>
      </div>
      <div id="packageList" class="package-list" role="group" aria-label="Enabled packages"></div>
    </section>

    <section class="instance-tools" aria-label="Create instance">
      <form id="instanceForm" class="instance-form">
        <label>
          <span>Name</span>
          <input name="name" required maxlength="120" autocomplete="off">
        </label>
        <label>
          <span>Description</span>
          <textarea name="description" rows="3" maxlength="600"></textarea>
        </label>
        <button type="submit">Create Instance</button>
      </form>
    </section>

    <section>
      <div class="section-heading">
        <h2>Your instances</h2>
      </div>
      <div id="message" class="message" role="status"></div>
      <div id="instances"></div>
    </section>
  </main>

  <aside id="updateBanner" class="update-banner" hidden>
    <p>Database package updates are available.</p>
    <button type="button" id="applyUpdatesButton">Update</button>
  </aside>

  <dialog id="packageModal" class="package-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Manage Packages</h2>
        <button type="button" id="closePackageModal" class="close-button" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body">
        <form id="packagePreviewForm">
          <label>
            <span>Git Repository URL</span>
            <input type="url" name="repoUrl" required placeholder="git@github.com:user/repo.git" autocomplete="off">
          </label>
          <button type="submit" id="previewPackageButton">Preview Package</button>
        </form>
        
        <div id="installedGitPackages" class="installed-packages-section">
          <hr>
          <h3>Installed Git Packages</h3>
          <div id="gitPackagesList" class="git-packages-list" role="list">
            <p class="empty-state">Loading installed packages...</p>
          </div>
        </div>

        <div id="packagePreviewResult" hidden>
          <hr>
          <h3>Package Preview</h3>
          <dl>
            <div><dt>Name</dt><dd id="previewName"></dd></div>
            <div><dt>Machine Name</dt><dd id="previewMachineName"></dd></div>
            <div><dt>Remote Version</dt><dd id="previewRemoteVersion"></dd></div>
            <div><dt>Local Version</dt><dd id="previewLocalVersion"></dd></div>
          </dl>
          <div id="packagePreviewMessage" class="message" role="status"></div>
          <button type="button" id="pullPackageButton" class="primary-button">Pull Package</button>
        </div>
      </div>
    </div>
  </dialog>
</body>
</html>
