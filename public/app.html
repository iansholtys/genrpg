<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GenRPG</title>
  <link rel="stylesheet" href="/static/css/table-vars.css">
  <link rel="stylesheet" href="/static/css/tabbed-region-vars.css">
  <link rel="stylesheet" href="/static/components/reusable/table/styles/table.css">
  <link rel="stylesheet" href="/static/components/reusable/tabbed-region/styles/tabbed-region.css">
  <link rel="stylesheet" href="/static/css/menu-vars.css">
  <link rel="stylesheet" href="/static/components/reusable/menu/styles/menu.css">
  <link rel="stylesheet" href="/static/css/notifications-vars.css">
  <link rel="stylesheet" href="/static/components/reusable/notifications/styles/notifications.css">
  <link rel="stylesheet" href="/static/components/reusable/modal/styles/modal.css">
  <link rel="stylesheet" href="/static/css/styles.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous" defer></script>
  <script src="/static/components/reusable/table/table.js" defer></script>
  <script src="/static/components/reusable/tabbed-region/tabbed-region.js" defer></script>
  <script src="/static/components/reusable/menu/menu.js" defer></script>
  <script src="/static/components/reusable/modal/modal.js" defer></script>
  <script src="/static/components/reusable/notifications/notifications.js" defer></script>
  <script type="module" src="/static/js/app.js" defer></script>
</head>

<body class="app-shell">
  <header class="topbar">
    <div>
      <p class="eyebrow">GenRPG</p>
      <h1>Instances</h1>
    </div>
    <div class="user-panel">
      <span id="userLabel">Signed in</span>
      <form id="logoutForm" action="/logout" method="post">
        <button type="submit" class="secondary-button">Log out</button>
      </form>
    </div>
  </header>

  <main class="workspace">
    <section class="instances-home" aria-label="Your instances">
      <div id="message" class="message" role="status"></div>
      <div id="instances"></div>
    </section>

    <section id="administrationSection" class="administration" hidden aria-label="Administration">
      <div class="section-heading">
        <h2>Administration</h2>
      </div>
      <div class="administration-actions">
        <button type="button" id="managePackagesButton" hidden>Manage Packages</button>
        <button type="button" id="manageRolesButton" hidden>Manage Roles</button>
        <button type="button" id="manageGlobalUsersButton" hidden>Manage Users</button>
      </div>
    </section>
  </main>

  <aside id="updateBanner" class="update-banner" hidden>
    <p>Database package updates are available.</p>
    <button type="button" id="applyUpdatesButton">Update</button>
  </aside>
</body>

</html>
